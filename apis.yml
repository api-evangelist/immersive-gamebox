name: Immersive Gamebox
description: 'Immersive Gamebox is a London-founded (2018) location-based entertainment company operating
  indoor gaming venues across the UK, US, Germany, and the UAE. Each Gamebox combines projection mapping,
  touch screens, motion tracking, and surround sound to deliver fully immersive, interactive games for
  teams of two to six players in 30-60 minute sessions. Its catalog spans licensed titles built with
  partners such as Netflix (Squid Game), Aardman (Shaun the Sheep), Rovio (Angry Birds), and Tetris,
  alongside originals, and the business runs on bookings, party and corporate packages, Game Pass
  subscriptions, and a multi-unit franchise model. The company was surfaced as a portfolio company of
  index-ventures. It exposes no public web/REST API today; developer collaboration is limited to a
  Unity-based SDK offered to game studios building titles for the Gamebox hardware platform.'
